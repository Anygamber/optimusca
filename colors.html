<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#DC2626">
  <meta name="color-scheme" content="light">
  <title>Палитра цветов Tikkurila | OPTIMUS CA</title>
  <meta name="description" content="Палитра 5099 оттенков Tikkurila: Symphony, RAL и фасадные цвета. Наведение увеличивает ячейку, клик открывает карточку с RGB и NCS.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://optimusca.uz/colors.html">
  <link rel="stylesheet" href="css/site-ux.css?v=20261016_inter">
  <script src="js/i18n.js?v=20261105_canon_clean" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { cta: '#DC2626' }
        }
      }
    }
  </script>
  <style>
    html, body { height: 100%; }
    body {
      background: #f4f4f5;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #site-header,
    .palette-toolbar,
    footer { flex-shrink: 0; }
    .palette-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px 16px;
    }
    .palette {
      display: grid;
      justify-content: center;
      align-content: center;
      gap: 1px;
    }
    .swatch {
      display: block;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      border-radius: 1px;
      cursor: pointer;
      position: relative;
      z-index: 1;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06);
    }
    .swatch:hover,
    .swatch:focus-visible {
      z-index: 30;
      transform: scale(var(--swatch-scale, 5));
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28), inset 0 0 0 1px rgba(0, 0, 0, 0.12);
      transition: transform 0.16s ease;
    }
    .swatch:focus-visible { outline: 2px solid #dc2626; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      .swatch:hover,
      .swatch:focus-visible { transform: none; transition: none; }
    }
    .loupe {
      position: fixed;
      z-index: 40;
      width: 168px;
      padding: 8px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }
    .loupe[hidden] { display: none; }
    .loupe-swatch {
      height: 72px;
      border-radius: 10px;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
    }
    .loupe p { margin: 6px 2px 0; }
    .loupe-name { font-size: 0.85rem; font-weight: 600; color: #18181b; }
    .loupe-code { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; color: #71717a; }
    .color-sheet {
      width: min(420px, calc(100vw - 2rem));
      padding: 0;
      border: 0;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.45);
    }
    .color-sheet::backdrop { background: rgba(24, 24, 27, 0.45); }
    .sheet-swatch { height: 180px; border-radius: 24px 24px 0 0; }
    .sheet-body { padding: 1.25rem 1.35rem 1.35rem; }
    .sheet-kicker {
      margin: 0;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #dc2626;
    }
    .sheet-body h2 { margin: 0.35rem 0 0; font-size: 1.45rem; font-weight: 600; color: #18181b; }
    .sheet-code { margin: 0.2rem 0 0; font-size: 0.85rem; font-weight: 600; color: #71717a; }
    .sheet-body dl { margin: 1rem 0 0; }
    .sheet-body dl div {
      display: grid;
      grid-template-columns: 5.5rem 1fr;
      gap: 0.5rem;
      padding: 0.45rem 0;
      border-top: 1px solid #f4f4f5;
    }
    .sheet-body dt { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #a1a1aa; }
    .sheet-body dd { margin: 0; font-size: 0.95rem; font-weight: 500; color: #27272a; }
    .sheet-close {
      margin-top: 1rem;
      border: 0;
      border-radius: 12px;
      background: #dc2626;
      color: #fff;
      font-weight: 600;
      padding: 0.7rem 1rem;
      cursor: pointer;
    }
    .sheet-close:hover { background: #b91c1c; }
  </style>
</head>
<body class="font-sans text-zinc-900 antialiased">
  <header id="site-header" class="z-50 border-b border-gray-100 bg-white/90 backdrop-blur-lg">
    <div class="header-bar mx-auto flex w-full max-w-6xl flex-nowrap items-center justify-between gap-3 px-4 py-3.5">
      <div class="header-brand flex shrink-0 items-center gap-3">
        <a href="index.html" class="group inline-flex items-center gap-2 text-sm font-bold text-zinc-900 transition-colors hover:text-red-600" aria-label="На главную">
          <span class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-red-50 text-red-600" aria-hidden="true">←</span>
          На главную
        </a>
      </div>
      <nav class="header-nav hidden min-w-0 flex-1 items-center justify-center gap-3 text-sm font-semibold text-zinc-600 sm:flex" aria-label="Навигация">
        <a href="index.html" class="text-lg font-semibold tracking-tight text-zinc-900">Tikkurila <span class="text-red-600">&amp;</span> Dekoral</a>
        <a href="blog.html" class="transition-colors hover:text-red-600">Блог</a>
        <a href="colors.html" class="text-red-600" aria-current="page">Цвета</a>
        <a href="faq.html" class="transition-colors hover:text-red-600">FAQ</a>
      </nav>
      <div id="lang-switcher" class="lang-switcher" role="group" aria-label="Til / Язык" data-i18n-skip="true"></div>
      <a href="index.html#lead-top" class="btn-cta group shrink-0 px-4 py-2.5 text-sm">
        Заявка
        <svg class="h-4 w-4 transition-transform duration-300 group-hover:translate-x-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </a>
    </div>
  </header>

  <div class="palette-toolbar mx-auto flex w-full max-w-6xl flex-col gap-3 px-4 pt-4 sm:flex-row sm:items-center">
    <h1 class="text-lg font-semibold tracking-tight text-zinc-900">Палитра <span id="color-count" class="font-medium text-zinc-500"></span></h1>
    <input id="color-search" type="search" placeholder="Название, код, RGB или NCS" aria-label="Поиск цвета" class="w-full rounded-xl border border-zinc-200 bg-white px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-red-600 sm:max-w-sm">
    <select id="color-group" aria-label="Коллекция" class="w-full rounded-xl border border-zinc-200 bg-white px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-red-600 sm:max-w-xs">
      <option value="">Все коллекции</option>
    </select>
  </div>

  <div class="palette-wrap">
    <div id="color-palette" class="palette" aria-label="Палитра цветов от тёмных к светлым"></div>
  </div>
  <p id="color-empty" class="px-4 pb-6 text-center text-sm text-zinc-600" hidden>Ничего не найдено.</p>

  <div id="color-loupe" class="loupe" hidden>
    <div class="loupe-swatch"></div>
    <p class="loupe-name"></p>
    <p class="loupe-code"></p>
  </div>

  <dialog id="color-sheet" class="color-sheet" aria-labelledby="sheet-title">
    <div class="sheet-swatch" id="sheet-swatch"></div>
    <div class="sheet-body">
      <p class="sheet-kicker">Карточка цвета</p>
      <h2 id="sheet-title"></h2>
      <p class="sheet-code" id="sheet-code"></p>
      <dl>
        <div><dt>RGB</dt><dd id="sheet-rgb"></dd></div>
        <div><dt>NCS</dt><dd id="sheet-ncs"></dd></div>
        <div><dt>HEX</dt><dd id="sheet-hex"></dd></div>
        <div><dt>Коллекция</dt><dd id="sheet-group"></dd></div>
      </dl>
      <button type="button" class="sheet-close" id="sheet-close">Закрыть</button>
    </div>
  </dialog>

  <footer class="bg-slate-900/75 text-gray-300 backdrop-blur-lg">
    <div class="mx-auto flex max-w-6xl flex-col gap-3 px-4 py-4 sm:flex-row sm:items-center sm:justify-between">
      <p class="text-sm">© 2026 Дистрибьютор Tikkurila и Dekoral в Ташкенте</p>
      <div class="flex flex-wrap gap-4 text-sm">
        <a href="index.html" class="font-semibold text-white transition-colors hover:text-red-400">← На главную</a>
        <a href="tikkurila.html" class="font-semibold text-white transition-colors hover:text-red-400">Tikkurila</a>
        <a href="dekoral.html" class="font-semibold text-white transition-colors hover:text-red-400">Dekoral</a>
        <a href="faq.html" class="font-semibold text-white transition-colors hover:text-red-400">FAQ</a>
      </div>
    </div>
  </footer>

  <script src="js/color-library-data.js"></script>
  <script src="js/color-library.js"></script>
</body>
</html>
